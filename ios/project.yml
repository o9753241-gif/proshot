# Описание проекта для XcodeGen. Файл .xcodeproj не хранится в репозитории:
# он генерируется одной командой и не порождает конфликтов слияния.
#
# На Mac:
#     brew install xcodegen
#     cd ios && xcodegen generate && open ProShot.xcodeproj
name: ProShot
options:
  bundleIdPrefix: ai.proshot
  deploymentTarget:
    # iOS 16: StoreKit 2 работает с 15, а всё, ради чего стояла 17 (Observation),
    # переведено на ObservableObject. Ниже 16 не имеет смысла — доля устройств
    # мизерная, а переделка слоя состояния большая.
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en

targets:
  ProShot:
    type: application
    platform: iOS
    sources:
      - path: ProShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.proshot.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Только iPhone. Универсальная сборка обязывает поддержать на iPad все
        # четыре ориентации, иначе App Store отклоняет пакет (ошибка 90474).
        TARGETED_DEVICE_FAMILY: "1"
    # ВАЖНО: всё, что должно попасть в Info.plist, пишется ЗДЕСЬ. Настройки
    # INFOPLIST_KEY_* работают только когда Xcode генерирует Info.plist сам;
    # у нас файл свой, и такие ключи в него не попадают вовсе. Приложение
    # из-за этого падало бы при первом обращении к камере или галерее.
    info:
      path: ProShot/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: ProShot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Объяснения доступа. Без любого из них система не покажет запрос,
        # а завершит приложение.
        # Значения на языке разработки. Переводы лежат в
        # Resources/<язык>.lproj/InfoPlist.strings и перекрывают эти строки.
        NSCameraUsageDescription: "To take your portrait right in the app and check the frame before the shutter."
        NSPhotoLibraryUsageDescription: "To pick a photo from your library when the camera isn't available."
        NSPhotoLibraryAddUsageDescription: "To save the finished portrait to your photo library."
        # Шрифт тот же, что в Android-версии: Inter, четыре начертания.
        # Файлы обязаны быть перечислены здесь, иначе система их не увидит.
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
